# E2E test stack: the app (built from the root Dockerfile, mock LLM, throwaway DB) + a Playwright runner.
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
name: finally-test

services:
  # Not named "app": .app is an HSTS-preloaded TLD, so Chromium would force https://app:8000.
  finally:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: "not-needed-in-mock-mode"
      DB_PATH: /app/db/finally.db
    # tmpfs rather than an anonymous volume: compose reuses anonymous volumes when recreating a
    # container, which would leak state between runs. tmpfs guarantees a fresh, seeded DB on every `up`.
    tmpfs:
      - /app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  playwright:
    # Keep in lockstep with @playwright/test in test/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      finally:
        condition: service_healthy
    working_dir: /work
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    volumes:
      - .:/work
      # Container-local node_modules so the host's install isn't used/clobbered.
      - /work/node_modules
    ipc: host
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
